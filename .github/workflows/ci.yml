name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

jobs:
  go-test:
    name: Go build, vet and race tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, agent]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build ./...
      - name: Build agent with release version injection
        if: matrix.module == 'agent'
        run: |
          VERSION_VALUE="$(cut -d- -f1 ../VERSION)"
          test -n "$VERSION_VALUE"
          go build -ldflags "-X main.version=$VERSION_VALUE" ./cmd/agent
      - name: Check release version single source
        if: matrix.module == 'agent'
        working-directory: ${{ github.workspace }}
        run: |
          matches=$(grep -RhnE '"1\.0\.[0-9]+"' agent/cmd/ backend/internal/version/version.go || true)
          printf '%s\n' "$matches"
          test "$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l)" -eq 1
      - run: go vet ./...
      - run: go test -race ./...

  docker-build:
    name: Docker Compose builds
    runs-on: ubuntu-latest
    env:
      YC_JWT_SECRET: ci-only-secret-with-at-least-32-characters
      YC_ADMIN_USERNAME: ci-admin
      YC_ADMIN_PASSWORD: ci-password-at-least-12
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build yuchen-panel-api
      - run: docker compose build yuchen-panel-frontend

  shell:
    name: Shell syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
      - name: ShellCheck
        shell: bash
        run: shellcheck --severity=error scripts/*.sh deploy/*.sh install.sh scripts/yuchen-panel
      - name: Docker installer preflight regression tests
        run: bash scripts/test-docker-install-preflight.sh
      - name: JWT notice and Doctor mode regression tests
        run: bash scripts/test-install-notices-doctor.sh
      - name: Bash syntax
        shell: bash
        run: |
          find scripts deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n install.sh
          bash -n scripts/yuchen-panel

  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund --progress=false
      - working-directory: frontend
        run: node --test tests/*.test.mjs
      - working-directory: frontend
        run: npm run build

  e2e-docker-install:
    name: Fresh Docker installer integration (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Integration test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y curl jq rsync python3
      - name: Execute isolated source installer and eight assertions
        shell: bash
        run: |
          set -o pipefail
          sudo bash scripts/e2e-docker-install-test.sh | tee task8-e2e-result.txt
          grep -Fq E2E_PASS task8-e2e-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task8-docker-installer-logs
          path: |
            .audit/task8-e2e/docker-install.log
            task8-e2e-result.txt
