name: Debug v1.0.4 validation
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/v1.0.4
      - name: Print validation values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TAG=v1.0.4
          echo "TAG=$TAG"
          echo "REF=$GITHUB_REF"
          echo "cat-file=$(git cat-file -t \"$TAG\")"; echo "cat_status=$?"
          echo "version=[$(sed 's/-stable$//' VERSION)]"; echo "version_status=$?"
          echo "package=[$(jq -r .version frontend/package.json)]"; echo "package_status=$?"
          gh release view "$TAG" >/dev/null 2>&1; echo "gh_release_status=$?"
          git show-ref --tags "$TAG"; echo "show_ref_status=$?"
          git rev-parse "$TAG"; echo "rev_parse_status=$?"
